<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-site-verification" content="foIoYYcMAXVD4QUDtF7VXbTCuUHfANFTcniU8PBeZb4" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('slumber.theme.preference');
          var preference = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
          var mode = preference === 'light' || preference === 'dark'
            ? preference
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = mode;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
    <!-- SOCIAL_META -->
    <script>
      // SPA: send the first pageview ourselves after React mounts.
      window.goatcounter = { no_onload: true }
    </script>
    <script
      data-goatcounter="https://ryab.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
